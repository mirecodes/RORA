# Dev: object pool for scripts/dev/random_run_pipeline.sh (e.g. user studies).
# counts: objects drawn per category, in the order listed under `objects` (CLI `run 1,1,0` overrides).
# seed: null draws a new set each run; the seed used is printed, so a draw can be repeated (CLI `run 1,1,0 <seed>`).
# parts / object_profile: as in batch_set_cfg.yml.
# start_stage: the GUI runs this stage and the ones after it (earlier stage switches are turned off for the session);
#   the earlier stages' results come from working/<source>/<object>/, copied over working/<object>/ before the GUI opens.
# source: the archived session (working/dev/<date_time>/) of the 2026-10-29 batch run that made the object profile.
counts: [1, 1, 0]
seed: null
start_stage: segment
defaults:
  extension: ply
  profile: partnet_object

objects:
  cat1:
    bucket: {parts: 2, object_profile: bucket_20261029_015825, source: dev/20261029_021529}
