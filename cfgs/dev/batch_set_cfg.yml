    microwave: {parts: 2, object_profile: null}
    trashcan: {parts: 2, object_profile: null}
    usb: {parts: 2, object_profile: null}
  cat2:
    box: {parts: 5, object_profile: null}
    faucet: {parts: 4, object_profile: null}
    folding_chair: {parts: 3, object_profile: null}
    refrigerator: {parts: 3, object_profile: null}
    toaster: {parts: 3, object_profile: null}
    toilet: {parts: 4, object_profile: null}    # the archived ours/ run used 4
  cat3:
    dispenser: {parts: 4, object_profile: null}
