# parts: number of parts for the segment stage (PartNet GT moving joints + 1).
# object_profile: GUI-saved snapshot (cfgs/profiles/objects/<stem>.yml); filled in after you save one in a run.
defaults:
  extension: ply
  profile: partnet_object

objects:
  cat1:
    bucket: {parts: 2, object_profile: bucket_20261029_015825}
