# Pipeline switches and per-stage parameters.
# Values written as "N%" are converted to pymeshlab.PercentageValue(N).

pipeline:
  stages:
    align: true
    refine: true
    decompose: true
    segment: true
    articulate: true
    bind: true
  restore_align: false                  # align stage restores the original pose instead of aligning
  debug_mode: true                      # show viewers / interactive UIs
  urdf_use_original_coordinates: false  # true: URDF & Gaussians in the original frame, false: aligned frame

transform:
  use_auto_alignment: true    # PCA/RANSAC z-up alignment; false = identity

refine:
  method: pymeshlab           # pymeshlab | point2mesh | pymeshlab_then_point2mesh
  point2mesh:
    iterations: 10
    gpu: -1                   # -1 = CPU
  pymeshlab:
    do_flatten_bottom: true
    steps:
      cleaning: true
      reconstruction: true
      vertex_selection: true
      decimation: true
      remeshing: true
      occlusion_repair: true
      close_holes: true
      attribute_transfer: true
    params:
      meshing_remove_connected_component_by_diameter:
        mincomponentdiag: "20%"
      generate_surface_reconstruction_screened_poisson:
        depth: 8              # default 10
        fulldepth: 8
        preclean: true
      compute_selection_by_condition_per_vertex:
        condselect: "(z < -1e-6)"
      meshing_decimation_quadric_edge_collapse:
        targetfacenum: 15000
        preservenormal: false
      meshing_isotropic_explicit_remeshing:
        targetlen: "1%"
        adaptive: true
      meshing_close_holes:
        maxholesize: 10000
      transfer_attributes_per_vertex:
        sourcemesh: 1
        targetmesh: 0
        vertexsampling: false
        geomtransfer: false
        normaltransfer: true
        colortransfer: true
        upperbound: "5%"

decompose:
  coacd:                      # passed as-is to coacd.run_coacd
    threshold: 0.05           # concavity (0.01~1), lower = more parts
    max_convex_hull: -1       # -1 = unlimited
    preprocess_mode: auto     # auto | on | off
    preprocess_resolution: 50 # 20~100
    resolution: 2000          # Hausdorff sampling (1e3~1e4)
    mcts_nodes: 20            # 10~40
    mcts_iterations: 150      # 60~2000
    mcts_max_depth: 3         # 2~7
    pca: false
    merge: true
    decimate: false
    max_ch_vertex: 256
    extrude: false
    extrude_margin: 0.01
    apx_mode: ch              # ch | box
    seed: 0

segment:
  allow_single_loop_rlp: true
  separator:                  # passed to lib.estimation.learn_separator_main
    max_hops: 10
    method: all               # linear | rbf | polyhedral | all
    C: 1.0
    gamma: scale
    use_signed_dist: true
    sdf_thresh: 0.0
    balance: None
    neighbor_threshold: 0.25
    min_size_to_keep: 0
    show_none_loops: false
  rlp_clustering:
    w_pos: 1.0
    w_ang: 0.5
    cost_max: null
  vector_augment_min_count: 2

articulate:
  urdf_name: object
  density: 1000.0
  mesh_fmt: stl

bind:
  k_neighbors: 3
  max_dist_rel: 1.0           # drop Gaussians farther than this * mesh diagonal
  z_cut_rel: -1000.0          # drop Gaussians below this * mesh diagonal
  verbose: true

visualization:
  vector_scale:
    length_factor: 1.0
    thickness_factor: 1.0
